services:
  claude:
    build: .
    container_name: esp8266-traffic-light-claude
    stdin_open: true
    tty: true
    working_dir: /workspace
    volumes:
      - ${WORKSPACE_PATH:-.}:/workspace
      - pio-cache:/home/node/.platformio
    environment:
      - TERM=xterm-256color
    network_mode: bridge
    security_opt:
      - no-new-privileges:true

volumes:
  pio-cache:
